name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama untuk ref yang sama bila ada push baru.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (root): lint & build ───────────────────────────────────────
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Backend (pnj-backend): install & syntax check ───────────────────────
  backend:
    name: Backend - Install & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pnj-backend/package-lock.json

      - name: Install dependencies
        working-directory: pnj-backend
        run: npm ci

      - name: Syntax check
        working-directory: pnj-backend
        run: find src server.js -name "*.js" -print0 | xargs -0 -n1 node --check

  # ── SonarCloud (non-blocking: tidak menggagalkan / memblokir deploy) ─────
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

  # ── Deploy ke VPS (hanya saat push ke main, setelah CI lulus) ───────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/logproapp/app

            echo ">> Pull kode terbaru..."
            git fetch origin main
            git reset --hard origin/main

            echo ">> Install dependency backend..."
            cd pnj-backend
            npm ci --omit=dev

            echo ">> Jalankan migrasi database..."
            npm run db:migrate

            echo ">> Install dependency & build frontend..."
            cd /var/www/logproapp/app
            npm ci
            NODE_ENV=production npm run build

            echo ">> Restart service..."
            pm2 restart pnj-backend pnj-pdf-worker pnj-frontend --update-env

            echo ">> Deploy selesai."
