name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend - Install & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pnj-backend/package-lock.json

      - name: Install dependencies
        working-directory: pnj-backend
        run: npm ci

      - name: Syntax check
        working-directory: pnj-backend
        run: find src server.js -name "*.js" -print0 | xargs -0 -n1 node --check

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [sonarcloud]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/logproapp/app

            echo ">> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo ">> Installing backend dependencies..."
            cd pnj-backend
            npm ci --omit=dev

            echo ">> Running database migrations..."
            npm run db:migrate

            echo ">> Installing frontend dependencies & building..."
            cd /var/www/logproapp/app
            npm ci
            NODE_ENV=production npm run build

            echo ">> Restarting services..."
            pm2 restart pnj-backend pnj-pdf-worker pnj-frontend

            echo ">> Deployment complete."
