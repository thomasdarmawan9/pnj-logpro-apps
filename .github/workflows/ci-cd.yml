name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama untuk ref yang sama bila ada push baru.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (root): lint & build ───────────────────────────────────────
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Backend (pnj-backend): install & syntax check ───────────────────────
  backend:
    name: Backend - Install & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pnj-backend/package-lock.json

      - name: Install dependencies
        working-directory: pnj-backend
        run: npm ci

      - name: Syntax check
        working-directory: pnj-backend
        run: find src server.js -name "*.js" -print0 | xargs -0 -n1 node --check

  # ── SonarCloud (non-blocking: tidak menggagalkan / memblokir deploy) ─────
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

  # ── Deploy ke VPS (self-hosted runner DI VPS; tanpa SSH masuk) ──────────
  # Runner berjalan di VPS & menarik job via koneksi keluar (443), lalu
  # men-deploy ke direktori live secara lokal.
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, linux, vps]
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy ke direktori live
        run: |
          set -e
          cd /var/www/logproapp/app

          echo ">> Pull kode terbaru..."
          git fetch origin main
          git reset --hard origin/main

          echo ">> Install dependency backend..."
          cd pnj-backend
          npm ci --omit=dev

          echo ">> Jalankan migrasi database (production)..."
          # sequelize-cli baca config production (use_env_variable DATABASE_URL).
          # Preload dotenv agar variabel dari .env tersedia, dan paksa
          # NODE_ENV=production (default sequelize-cli = development).
          NODE_ENV=production NODE_OPTIONS='-r dotenv/config' npm run db:migrate

          echo ">> Install dependency & build frontend..."
          cd /var/www/logproapp/app
          npm ci
          NODE_ENV=production npm run build

          echo ">> Restart service..."
          pm2 restart pnj-backend pnj-pdf-worker pnj-frontend --update-env

          echo ">> Deploy selesai."
